<h1 mat-dialog-title>{{ t.title }}</h1>
<mat-dialog-content>
  @if (loading()) {
    <div class="loading-container">
      <app-loading-spinner [diameter]="50" />
      <p>{{ t.loading }}</p>
    </div>
  } @else {
    @if (error()) {
      <div class="error-message">
        <mat-icon color="warn">info</mat-icon>
        <span>{{ error() }}</span>
      </div>
    }

    <p class="dialog-message">{{ t.prompt }}</p>

    <mat-form-field appearance="outline" class="phenomenon-select">
      <mat-label>{{ t.codeLabel }}</mat-label>
      <mat-select
        [value]="selectedCode()"
        (valueChange)="selectedCode.set($event)"
        data-testid="dialog-phenomenon-select"
      >
        @for (phenomenon of phenomenonCodes(); track phenomenon.code) {
          <mat-option [value]="phenomenon.code">
            {{ phenomenon.code }} - {{ phenomenon.description }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" data-testid="dialog-phenomenon-cancel">
    {{ common.cancel }}
  </button>
  <button
    mat-flat-button
    color="primary"
    (click)="onConfirm()"
    [disabled]="selectedCode() === null || loading()"
    cdkFocusInitial
    data-testid="dialog-phenomenon-confirm"
  >
    {{ t.confirm }}
  </button>
</mat-dialog-actions>
