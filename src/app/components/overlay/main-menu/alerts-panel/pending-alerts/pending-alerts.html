@if (pendingAlerts().length === 0) {
  <p class="group-empty">{{ emitted.noPending }}</p>
} @else {
  <div class="items">
    @for (alert of pendingAlerts(); track alert.alertId) {
      <app-alert-list-item
        mode="pending"
        [attr.data-testid]="'alerts-pending-' + alert.alertId"
        [title]="details.alertTitle(alert.alertId)"
        [hidden]="isHidden(alert.alertId)"
        [details]="getDetailRows(alert)"
        (titleClick)="flyToAlert(alert)"
      >
        <div item-actions>
          <button
            mat-icon-button
            (click)="toggleHidden(alert.alertId)"
            [matTooltip]="isHidden(alert.alertId) ? common.show : common.hide"
          >
            <mat-icon>{{ isHidden(alert.alertId) ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>

        <app-detail-item icon="image" [label]="details.images">
          <div class="gif-actions">
            <button
              mat-icon-button
              (click)="openAreaGif(alert)"
              [matTooltip]="details.viewAreaImage"
              data-testid="alerts-pending-gif-area"
            >
              <mat-icon>zoom_in</mat-icon>
            </button>
            <button
              mat-icon-button
              (click)="openGralGif(alert)"
              [matTooltip]="details.viewGeneralImage"
              data-testid="alerts-pending-gif-general"
            >
              <mat-icon>public</mat-icon>
            </button>
          </div>
        </app-detail-item>

        <mat-divider />

        @if (alert.departments.length > 0) {
          <app-department-list
            [departments]="getDepartments(alert)"
            (opened)="onDepartmentsOpened(alert)"
            (closed)="onDepartmentsClosed(alert)"
            (departmentHover)="onDepartmentHover($event)"
            (provinceHover)="onProvinceHover($event)"
            (departmentLeave)="onDepartmentLeave()"
          />
        } @else {
          <app-detail-item icon="map" [label]="details.departments">
            <span class="detail-value">{{ details.noDepartments }}</span>
          </app-detail-item>
        }
      </app-alert-list-item>
      @if (!$last) {
        <mat-divider />
      }
    }
  </div>
}
