<div class="active-layers">
  @if (getActiveLayers().length === 0) {
    <app-empty-state icon="layers_clear" [heading]="t.emptyTitle" [hint]="t.emptyHint" />
  } @else {
    @for (group of activeLayerGroups(); track group.id) {
      @if (group.layers.length > 0) {
        <mat-expansion-panel
          class="active-group-panel"
          [attr.data-testid]="'layers-active-group-' + group.id"
          [expanded]="group.expanded()"
          (expandedChange)="group.setExpanded($event)"
        >
          <mat-expansion-panel-header>
            <mat-panel-title>
              <mat-icon class="group-icon">{{ group.icon }}</mat-icon>
              <span class="group-title" [matTooltip]="group.description">{{ group.name }}</span>
            </mat-panel-title>
            <mat-panel-description>
              <button
                mat-icon-button
                class="clear-group-button"
                data-testid="layers-active-group-clear"
                (click)="group.clearGroup($event)"
                [matTooltip]="t.clearGroup(group.name)"
              >
                <mat-icon>delete_sweep</mat-icon>
              </button>
            </mat-panel-description>
          </mat-expansion-panel-header>
          <div
            cdkDropList
            (cdkDropListDropped)="group.onDrop($event)"
            class="active-layers-list"
            data-testid="layers-active-droplist"
          >
            @for (layer of group.layers; track layer.id; let isLast = $last) {
              <div cdkDrag class="active-layer-item">
                <app-layer-item [layer]="layer" [mode]="LayerItemMode.ACTIVE" />
              </div>
              @if (!isLast) {
                <mat-divider />
              }
            }
          </div>
        </mat-expansion-panel>
      }
    }
  }
</div>
