<div class="sync-playback">
  @for (groupId of activeGroupIds(); track groupId) {
    <app-sync-group [groupId]="groupId" />
  } @empty {
    <app-empty-state
      icon="sync_disabled"
      heading="Nada para sincronizar"
      hint="Encendé radares, satélites o modelos numéricos para animarlos juntos."
    />
  }
</div>
