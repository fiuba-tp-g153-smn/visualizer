<div class="layer-list" [class.disabled-state]="!hasAvailableLayers()">
  @if (!hasAvailableLayers()) {
    <div class="empty-state-container">
      <mat-icon class="empty-icon">layers_clear</mat-icon>
      <h3>{{ t.noLayers.title }}</h3>
      <p>{{ t.noLayers.hint }}</p>
    </div>
  } @else {
    <mat-tab-group class="layer-tabs" animationDuration="0ms">
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="tab-label-container" data-testid="layers-tab-available">
            <mat-icon class="tab-icon">grid_view</mat-icon>
            <span class="tab-label">{{ t.tabs.available }}</span>
          </div>
        </ng-template>
        <div class="tab-content">
          <app-available-layers />
        </div>
      </mat-tab>

      <mat-tab>
        <ng-template mat-tab-label>
          <div class="tab-label-container" data-testid="layers-tab-active">
            <mat-icon class="tab-icon">tune</mat-icon>
            <span class="tab-label">{{ t.tabs.active }}</span>
            <span class="active-count" [class.visible]="getActiveLayersCount() > 0">
              {{ getActiveLayersCount() }}
            </span>
          </div>
        </ng-template>
        <div class="tab-content">
          <app-active-layers />
        </div>
      </mat-tab>

      <mat-tab>
        <ng-template mat-tab-label>
          <div class="tab-label-container" data-testid="layers-tab-sync">
            <mat-icon class="tab-icon">sync</mat-icon>
            <span class="tab-label">{{ t.tabs.sync }}</span>
            <span class="active-count" [class.visible]="syncSelectedCount() > 0">
              {{ syncSelectedCount() }}
            </span>
          </div>
        </ng-template>
        <div class="tab-content">
          <app-sync-playback />
        </div>
      </mat-tab>
    </mat-tab-group>
  }
</div>
