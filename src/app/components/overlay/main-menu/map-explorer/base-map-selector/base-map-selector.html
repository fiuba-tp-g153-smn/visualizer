<div class="base-map-selector">
  @switch (loadState()) {
    @case ('loading') {
      <div class="base-map-status">
        <app-loading-spinner [diameter]="32" />
        <span>{{ t.loading }}</span>
      </div>
    }
    @case ('error') {
      <div class="base-map-status base-map-status--error">
        <mat-icon>error</mat-icon>
        <span>{{ t.error }}</span>
      </div>
    }
    @default {
      @if (baseMaps().length === 0) {
        <div class="base-map-status">
          <mat-icon>layers_clear</mat-icon>
          <span>{{ t.empty }}</span>
        </div>
      } @else {
        <div class="base-map-grid" data-testid="explorer-basemap-grid">
          @for (baseMap of baseMaps(); track baseMap.id) {
            <div
              class="base-map-card"
              [attr.data-testid]="'explorer-basemap-' + baseMap.id"
              [class.active]="isActive(baseMap.id)"
              (click)="selectBaseMap(baseMap.id)"
            >
              <div class="base-map-preview">
                <img [src]="getPreviewUrl(baseMap)" alt="" class="preview-image" />
              </div>
              <div class="base-map-info">
                <h4 class="base-map-name">{{ baseMap.name }}</h4>
                <span class="base-map-attribution">{{ getAttributionText(baseMap) }}</span>
              </div>
            </div>
          }
        </div>
      }
    }
  }
</div>
