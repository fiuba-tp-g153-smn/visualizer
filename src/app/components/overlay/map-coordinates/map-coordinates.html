@if (visible()) {
  <div class="coordinates" data-testid="map-coordinates">
    <app-panel-close-button
      class="close-button"
      [ariaLabel]="t.closeCoordinates"
      (pressed)="onClose()"
    />
    @if (latitude() !== null && longitude() !== null) {
      <span class="coord">{{ t.latPrefix }} {{ latitude() | number: '1.4-4' }}°</span>
      <span class="separator">,</span>
      <span class="coord">{{ t.lonPrefix }} {{ longitude() | number: '1.4-4' }}°</span>
    } @else {
      <span class="coord placeholder">{{ t.latPrefix }} {{ t.coordPlaceholder }}</span>
      <span class="separator">,</span>
      <span class="coord placeholder">{{ t.lonPrefix }} {{ t.coordPlaceholder }}</span>
    }
  </div>
}
