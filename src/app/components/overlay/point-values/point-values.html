<div
  class="point-value-container"
  data-testid="map-point-values"
  [class.near-marker]="layoutMode() === PointValuesLayoutMode.NEAR_MARKER"
>
  @if (visible()) {
    @if (layoutMode() === PointValuesLayoutMode.NEAR_MARKER) {
      <div class="point-value-column">
        @for (entry of entries(); track entry.layerId) {
          <app-point-value-panel
            [visible]="true"
            [isLoading]="entry.isLoading"
            [layerName]="entry.layerName"
            [periodLabel]="entry.periodLabel"
            [runLabel]="entry.runLabel"
            [elevationLabel]="entry.elevationLabel"
            [isPlaying]="entry.isPlaying"
            [data]="entry.data"
            (close)="onClose(entry.layerId)"
          />
        }
      </div>
    } @else {
      @for (column of columns(); track $index) {
        @if (column.length > 0) {
          <div class="point-value-column">
            @for (entry of column; track entry.layerId) {
              <app-point-value-panel
                [visible]="true"
                [isLoading]="entry.isLoading"
                [layerName]="entry.layerName"
                [periodLabel]="entry.periodLabel"
                [runLabel]="entry.runLabel"
                [elevationLabel]="entry.elevationLabel"
                [isPlaying]="entry.isPlaying"
                [minDetailLines]="entry.minDetailLines"
                [data]="entry.data"
                (close)="onClose(entry.layerId)"
              />
            }
          </div>
        }
      }
    }
  }
</div>
