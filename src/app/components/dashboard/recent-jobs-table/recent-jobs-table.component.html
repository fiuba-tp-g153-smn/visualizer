<div class="jobs__scroll">
  <app-sortable-table
    [headers]="table().headers"
    [rows]="table().tableRows"
    [initialSort]="initialSort"
    [emptyText]="t.noJobsYet"
    (rowClick)="onRowClick($event)"
  />
</div>

<div class="jobs__foot">
  <button mat-stroked-button [disabled]="!hasMore()" (click)="loadMore.emit()">
    {{ t.loadMore }}
  </button>
  <span class="jobs__count">{{ t.loadedCount(jobs().length) }}</span>
  <span class="jobs__hint">{{ t.sortHint }}</span>
</div>
