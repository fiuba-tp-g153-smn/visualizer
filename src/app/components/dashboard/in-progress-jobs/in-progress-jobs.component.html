<div class="ip__stat">
  <div class="ip__k">en proceso</div>
  <div class="ip__v">{{ jobs().length }}</div>
</div>

@if (jobs().length) {
  <div class="ip__scroll">
    <table class="ip__table">
      <thead>
        <tr>
          <th>imagen</th>
          <th>banda</th>
          <th>estado</th>
          <th>desde</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.image_id + '|' + row.band_id) {
          <tr>
            <td class="l"><span class="ip__dot"></span>{{ row.image_id }}</td>
            <td class="l muted">{{ row.band_id }}</td>
            <td class="l muted">{{ row.status }}</td>
            <td class="r muted">{{ row.since }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
} @else {
  <div class="ip__empty">No hay trabajos en proceso.</div>
}
