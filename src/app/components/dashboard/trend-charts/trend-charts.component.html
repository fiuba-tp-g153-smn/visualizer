<div class="charts">
  <div class="cell">
    <div class="cell__head">
      <span class="cell__t">{{ t.evolution }}</span>
      <mat-icon class="cell__info" [matTooltip]="t.evolutionHint" matTooltipPosition="above"
        >info</mat-icon
      >
    </div>
    <div class="cell__sub">{{ t.evolutionSub }}</div>
    <div class="cell__box"><app-metric-chart [options]="evolutionChart()" /></div>
  </div>

  <div class="cell">
    <div class="cell__head">
      <span class="cell__t">{{ t.throughput }}</span>
      <mat-icon class="cell__info" [matTooltip]="t.throughputHint" matTooltipPosition="above"
        >info</mat-icon
      >
    </div>
    <div class="cell__sub">{{ t.throughputSub }}</div>
    <div class="cell__box"><app-metric-chart [options]="throughputChart()" /></div>
  </div>

  <div class="cell">
    <div class="cell__head">
      <span class="cell__t">{{ common.stageBreakdown }}</span>
      <mat-icon class="cell__info" [matTooltip]="t.stagesHint" matTooltipPosition="above"
        >info</mat-icon
      >
    </div>
    <div class="cell__sub">
      {{ t.stagesSub }}
      <select class="cell__select" [value]="effectiveType()" (change)="onStageTypeChange($event)">
        @for (jobType of jobTypes(); track jobType) {
          <option [value]="jobType">{{ jobType }}</option>
        }
      </select>
    </div>
    <div class="cell__box"><app-metric-chart [options]="stageChart()" /></div>
  </div>

  <div class="cell">
    <div class="cell__head">
      <span class="cell__t">{{ t.p95 }}</span>
      <mat-icon class="cell__info" [matTooltip]="t.p95Hint" matTooltipPosition="above"
        >info</mat-icon
      >
    </div>
    <div class="cell__sub">{{ t.p95Sub }}</div>
    <div class="cell__box"><app-metric-chart [options]="p95Chart()" /></div>
  </div>
</div>

@if (!hasData()) {
  <div class="note">{{ t.noSuccesses }}</div>
}
