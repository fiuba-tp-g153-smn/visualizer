<div class="dash">
  <header class="dash__head">
    <span class="dash__brand">
      <span
        class="dash__status"
        [class.dash__status--up]="online() === true"
        [class.dash__status--down]="online() === false"
        [matTooltip]="
          online() === false ? t.offline : online() === true ? t.online : page.connecting
        "
      ></span>
      <span class="dash__title">{{ t.title }}</span>
    </span>
    <span class="dash__spacer"></span>

    <label class="dash__ctl">
      <span class="dash__ctl-title" matTooltipClass="nav-tip" [matTooltip]="page.refreshHint">{{
        page.refreshEvery
      }}</span>
      <select [value]="refreshSecs()" (change)="onRefreshChange($event)">
        <option value="0">{{ page.off }}</option>
        <option value="10">10s</option>
        <option value="30">30s</option>
        <option value="60">60s</option>
      </select>
    </label>
    <div class="dash__refresh-wrap">
      <button
        mat-stroked-button
        class="dash__refresh"
        (click)="refreshNow()"
        [disabled]="loading()"
        [matTooltip]="page.refreshNowHint"
        matTooltipClass="nav-tip"
      >
        <span class="dash__refresh-glyph">
          @if (loading()) {
            <mat-spinner diameter="16" />
          } @else {
            <mat-icon>refresh</mat-icon>
          }
        </span>
        {{ page.refresh }}
      </button>
      <span class="dash__updated">{{ page.updated(updatedAt()) }}</span>
    </div>
  </header>

  <main class="dash__body">
    @if (errorMsg(); as err) {
      <div class="dash__error" role="alert">
        <mat-icon>error</mat-icon>
        <span>{{ t.updateError(err) }}</span>
        <button mat-button (click)="refreshNow()" [disabled]="loading()">{{ page.retry }}</button>
      </div>
    }

    @if (firstLoad()) {
      <div class="dash__loading">
        <mat-spinner diameter="40" />
        <span>{{ t.loading }}</span>
      </div>
    } @else {
      <div
        class="dash__content"
        [class.dash__content--busy]="reloading()"
        [attr.aria-busy]="reloading()"
      >
        <app-metric-panel [heading]="t.panel" [tip]="tip">
          <span panelActions class="dash__stamp">{{ basemapStamp() }}</span>
          <div class="dash__scroll-x">
            <app-basemap-providers-table [providers]="providers()" />
          </div>
        </app-metric-panel>
      </div>

      @if (reloading()) {
        <div class="dash__overlay" role="status" aria-live="polite">
          <mat-spinner diameter="40" />
          <span>{{ t.loading }}</span>
        </div>
      }
    }
  </main>
</div>
