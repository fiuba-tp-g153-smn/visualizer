<div class="status">
  <header class="status__bar">
    <button mat-icon-button (click)="goBack()" [attr.aria-label]="t.back" [matTooltip]="t.goToMap">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <div class="status__tabs" role="tablist" [attr.aria-label]="t.tabsAria">
      <a
        class="status__tab"
        role="tab"
        routerLink="processing"
        routerLinkActive="status__tab--active"
        [routerLinkActiveOptions]="{ exact: true }"
        #rlaProcessing="routerLinkActive"
        [attr.aria-selected]="rlaProcessing.isActive"
      >
        <mat-icon>assessment</mat-icon>
        <span>{{ t.tabs.processing }}</span>
      </a>
      <a
        class="status__tab"
        role="tab"
        routerLink="cache"
        routerLinkActive="status__tab--active"
        [routerLinkActiveOptions]="{ exact: true }"
        #rlaCache="routerLinkActive"
        [attr.aria-selected]="rlaCache.isActive"
      >
        <mat-icon>save_clock</mat-icon>
        <span>{{ t.tabs.cache }}</span>
      </a>
      <a
        class="status__tab"
        role="tab"
        routerLink="basemap"
        routerLinkActive="status__tab--active"
        [routerLinkActiveOptions]="{ exact: true }"
        #rlaBasemap="routerLinkActive"
        [attr.aria-selected]="rlaBasemap.isActive"
      >
        <mat-icon>layers</mat-icon>
        <span>{{ t.tabs.basemap }}</span>
      </a>
      <a
        class="status__tab"
        role="tab"
        routerLink="alerts"
        routerLinkActive="status__tab--active"
        [routerLinkActiveOptions]="{ exact: true }"
        #rlaAlerts="routerLinkActive"
        [attr.aria-selected]="rlaAlerts.isActive"
      >
        <mat-icon>warning</mat-icon>
        <span>{{ t.tabs.alerts }}</span>
      </a>
    </div>
  </header>

  <div class="status__body">
    <router-outlet />
  </div>
</div>
