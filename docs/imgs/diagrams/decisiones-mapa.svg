<svg viewBox="0 0 880 470" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="880" height="470" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="600" fill="#111827">Decisiones de arquitectura — qué fuerza a qué</text>
<text x="24" y="52" font-size="11" fill="#6b7280">Las flechas apuntan a lo que cada decisión obliga</text>
<rect x="24" y="336" width="832" height="60" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
<rect x="140" y="76" width="200" height="52" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
<text x="240.0" y="98.5" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">Cuatro repositorios</text>
<text x="240.0" y="114.5" font-size="11" fill="#6b7280" text-anchor="middle">cuatro stacks independientes</text>
<rect x="540" y="76" width="200" height="52" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
<text x="640.0" y="98.5" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">Datos geoespaciales pesados</text>
<text x="640.0" y="114.5" font-size="11" fill="#6b7280" text-anchor="middle">gigabytes en RAM por archivo</text>
<rect x="24" y="200" width="176" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="112.0" y="222.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Almacén S3 en el medio</text>
<text x="112.0" y="238.5" font-size="11" fill="#6b7280" text-anchor="middle">única costura de datos</text>
<rect x="242" y="200" width="176" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="330.0" y="222.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">HTTP desde el navegador</text>
<text x="330.0" y="238.5" font-size="11" fill="#6b7280" text-anchor="middle">sin proxy en el visualizador</text>
<rect x="460" y="200" width="176" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="548.0" y="222.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Un subproceso por unidad</text>
<text x="548.0" y="238.5" font-size="11" fill="#6b7280" text-anchor="middle">la RAM vuelve al sistema</text>
<rect x="678" y="200" width="176" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="766.0" y="222.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Colas pesada y livianas</text>
<text x="766.0" y="238.5" font-size="11" fill="#6b7280" text-anchor="middle">dos tipos de worker</text>
<line x1="207.0" y1="134.0" x2="151.5" y2="187.7" stroke="#1f2937" stroke-width="1.5"/>
<polygon points="145.0,194.0 149.0,185.2 154.0,190.3" fill="#1f2937"/>
<text x="168.0" y="168.0" font-size="11" fill="#374151" text-anchor="end">nada comparte código ni base</text>
<line x1="263.2" y1="134.0" x2="301.5" y2="186.7" stroke="#1f2937" stroke-width="1.5"/>
<polygon points="306.8,194.0 298.6,188.8 304.4,184.6" fill="#1f2937"/>
<text x="312.0" y="168.0" font-size="11" fill="#374151" text-anchor="start">cada API es pública</text>
<line x1="616.3" y1="134.0" x2="577.1" y2="186.8" stroke="#1f2937" stroke-width="1.5"/>
<polygon points="571.7,194.0 574.2,184.6 580.0,188.9" fill="#1f2937"/>
<text x="580.0" y="168.0" font-size="11" fill="#374151" text-anchor="end">glibc no devuelve arenas</text>
<line x1="672.5" y1="134.0" x2="727.1" y2="187.7" stroke="#1f2937" stroke-width="1.5"/>
<polygon points="733.5,194.0 724.5,190.3 729.6,185.1" fill="#1f2937"/>
<text x="704.0" y="168.0" font-size="11" fill="#374151" text-anchor="start">pocos trabajos caros</text>
<text x="40" y="360" font-size="11" font-weight="600" fill="#374151" text-anchor="start">Lo que se paga:</text>
<text x="40" y="380" font-size="11" font-weight="400" fill="#374151" text-anchor="start">el almacén es el punto de falla compartido · el navegador necesita tres puertos abiertos · un VPS con mucha RAM en lugar de máquinas efímeras</text>
<text x="24" y="450" font-size="11" fill="#6b7280">· sin Kubernetes, reintentos en la aplicación y configuración horneada del visualizador: derivan de las mismas dos raíces</text>
</svg>
