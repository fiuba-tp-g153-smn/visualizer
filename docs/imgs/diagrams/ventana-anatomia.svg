<svg viewBox="0 0 880 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="880" height="500" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="600" fill="#111827">La ventana</text>
<text x="24" y="52" font-size="11" fill="#6b7280">Una columna de íconos, un panel y el mapa</text>
<rect x="24" y="64" width="832" height="396" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="40" y="86" font-size="10" font-weight="600" letter-spacing="0.08em" fill="#6b7280">LA VENTANA DEL NAVEGADOR</text>
<rect x="40" y="100" width="176" height="340" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="56" y="122" font-size="10" font-weight="600" letter-spacing="0.08em" fill="#6b7280">BARRA LATERAL</text>
