<rect x="56" y="220" width="144" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="128.0" y="242.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Estado · Docs</text>
<text x="128.0" y="258.5" font-size="11" fill="#6b7280" text-anchor="middle">dos accesos aparte</text>
<rect x="56" y="304" width="144" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="128.0" y="326.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Zoom</text>
<text x="128.0" y="342.5" font-size="11" fill="#6b7280" text-anchor="middle">+ · nivel · −</text>
<rect x="256" y="136" width="168" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
