<text x="340.0" y="174.5" font-size="11" fill="#6b7280" text-anchor="middle">uno de los cinco</text>
<rect x="480" y="136" width="176" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="568.0" y="158.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">El área de trabajo</text>
<text x="568.0" y="174.5" font-size="11" fill="#6b7280" text-anchor="middle">arrastrar y rueda</text>
<rect x="480" y="304" width="200" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="580.0" y="326.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Indicadores</text>
<text x="580.0" y="342.5" font-size="11" fill="#6b7280" text-anchor="middle">escala · coordenadas · atribución</text>
<rect x="664" y="136" width="160" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="744.0" y="158.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Columna derecha</text>
<text x="744.0" y="174.5" font-size="11" fill="#6b7280" text-anchor="middle">escalas y valores</text>
<line x1="206.0" y1="162.0" x2="241.0" y2="162.0" stroke="#1f2937" stroke-width="1.5"/>
<polygon points="250.0,162.0 241.0,165.6 241.0,158.4" fill="#1f2937"/>
<text x="228.0" y="154.0" font-size="11" fill="#374151" text-anchor="middle">abre</text>
<rect x="24.0" y="443" width="22" height="14" rx="3" fill="#eef2ff" stroke="#4338ca" stroke-width="1.2"/>
<text x="54.0" y="454" font-size="11" fill="#374151">desde donde se controla todo</text>
<text x="24" y="480" font-size="11" fill="#6b7280">· los indicadores y el zoom se apagan desde Herramientas del mapa ▸ General · la columna derecha aparece sólo con esas herramientas activas</text>
