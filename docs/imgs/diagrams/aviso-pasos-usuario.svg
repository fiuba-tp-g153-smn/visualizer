<svg viewBox="0 0 880 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="880" height="420" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="600" fill="#111827">Emitir un aviso a corto plazo</text>
<text x="24" y="52" font-size="11" fill="#6b7280">Los pasos del pronosticador; sin servicios ni rutas</text>
<rect x="24" y="100" width="176" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="112.0" y="122.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">1 · Dibujar el área</text>
<text x="112.0" y="138.5" font-size="11" fill="#6b7280" text-anchor="middle">clic por vértice</text>
<rect x="248" y="100" width="176" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="336.0" y="122.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">2 · Ajustar</text>
<text x="336.0" y="138.5" font-size="11" fill="#6b7280" text-anchor="middle">detalle · recorte</text>
<rect x="472" y="100" width="176" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="560.0" y="122.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">3 · Verificar</text>
<text x="560.0" y="138.5" font-size="11" fill="#6b7280" text-anchor="middle">qué departamentos toca</text>
<rect x="696" y="100" width="160" height="52" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
<text x="776.0" y="122.5" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">4 · Elegir el fenómeno</text>
<text x="776.0" y="138.5" font-size="11" fill="#6b7280" text-anchor="middle">y confirmar</text>
<rect x="696" y="236" width="160" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="776.0" y="258.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">5 · Se genera</text>
<text x="776.0" y="274.5" font-size="11" fill="#6b7280" text-anchor="middle">sola, en segundo plano</text>
<rect x="472" y="236" width="176" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="560.0" y="258.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">6 · Pendiente</text>
<text x="560.0" y="274.5" font-size="11" fill="#6b7280" text-anchor="middle">con sus dos imágenes</text>
<rect x="248" y="236" width="176" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="336.0" y="258.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Circuito del SMN</text>
<text x="336.0" y="274.5" font-size="11" fill="#6b7280" text-anchor="middle">lo completa y difunde</text>
<line x1="206.0" y1="126.0" x2="233.0" y2="126.0" stroke="#1f2937" stroke-width="1.5"/>
