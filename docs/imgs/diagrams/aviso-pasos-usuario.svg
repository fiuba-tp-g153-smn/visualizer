<text x="54.0" y="374" font-size="11" fill="#374151">el paso que no se puede deshacer</text>
<rect x="264.4" y="363" width="22" height="14" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="294.4" y="374" font-size="11" fill="#374151">fuera de la aplicación</text>
<text x="24" y="400" font-size="11" fill="#6b7280">· generar un aviso acá no equivale a publicarlo · recargar la página no lo duplica</text>
