<svg viewBox="0 0 880 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="880" height="420" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="600" fill="#111827">Ciclo de vida de una unidad de trabajo</text>
<text x="24" y="52" font-size="11" fill="#6b7280">La fila en processed_images y el destino del mensaje</text>
<rect x="24" y="148" width="152" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="100.0" y="170.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Sin registrar</text>
<text x="100.0" y="186.5" font-size="11" fill="#6b7280" text-anchor="middle">imagen nueva en la fuente</text>
<rect x="232" y="148" width="152" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="308.0" y="170.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">IN_PROGRESS</text>
<text x="308.0" y="186.5" font-size="11" fill="#6b7280" text-anchor="middle">publicada por el producer</text>
<rect x="440" y="148" width="152" height="52" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
<text x="516.0" y="170.5" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">PROCESSING</text>
<text x="516.0" y="186.5" font-size="11" fill="#6b7280" text-anchor="middle">tomada por un worker</text>
<rect x="648" y="148" width="152" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="724.0" y="170.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Fila borrada</text>
<text x="724.0" y="186.5" font-size="11" fill="#6b7280" text-anchor="middle">éxito · ack</text>
<rect x="440" y="292" width="152" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="516.0" y="314.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Reintento</text>
<text x="516.0" y="330.5" font-size="11" fill="#6b7280" text-anchor="middle">retry_count + 1</text>
<rect x="648" y="292" width="152" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="724.0" y="314.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Cola de descarte</text>
<text x="724.0" y="330.5" font-size="11" fill="#6b7280" text-anchor="middle">4 intentos agotados</text>
<rect x="24" y="292" width="152" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="100.0" y="314.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Fila liberada</text>
<text x="100.0" y="330.5" font-size="11" fill="#6b7280" text-anchor="middle">fuente no disponible · ack</text>
<line x1="182.0" y1="174.0" x2="217.0" y2="174.0" stroke="#1f2937" stroke-width="1.5"/>
<polygon points="226.0,174.0 217.0,177.6 217.0,170.4" fill="#1f2937"/>
<text x="204.0" y="138.0" font-size="11" fill="#374151" text-anchor="middle">el producer publica</text>
<line x1="390.0" y1="174.0" x2="425.0" y2="174.0" stroke="#1f2937" stroke-width="1.5"/>
<polygon points="434.0,174.0 425.0,177.6 425.0,170.4" fill="#1f2937"/>
<text x="412.0" y="138.0" font-size="11" fill="#374151" text-anchor="middle">un worker la toma</text>
<line x1="598.0" y1="174.0" x2="633.0" y2="174.0" stroke="#1f2937" stroke-width="1.5"/>
<polygon points="642.0,174.0 633.0,177.6 633.0,170.4" fill="#1f2937"/>
<text x="620.0" y="138.0" font-size="11" fill="#374151" text-anchor="middle">exit 0</text>
<line x1="516.0" y1="206.0" x2="516.0" y2="277.0" stroke="#1f2937" stroke-width="1.5"/>
<polygon points="516.0,286.0 512.4,277.0 519.6,277.0" fill="#1f2937"/>
<text x="524.0" y="252.0" font-size="11" fill="#374151" text-anchor="start">otro error</text>
<line x1="562.2" y1="206.0" x2="670.4" y2="280.9" stroke="#1f2937" stroke-width="1.5"/>
<polygon points="677.8,286.0 668.3,283.8 672.4,277.9" fill="#1f2937"/>
<text x="636.0" y="236.0" font-size="11" fill="#374151" text-anchor="start">sin reintentos</text>
<line x1="434.0" y1="202.4" x2="190.5" y2="286.7" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4"/>
<polygon points="182.0,289.6 189.3,283.3 191.7,290.1" fill="#1f2937"/>
<text x="312.0" y="268.0" font-size="11" fill="#374151" text-anchor="end">pronóstico aún no publicado</text>
<line x1="100.0" y1="286.0" x2="100.0" y2="215.0" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4"/>
<polygon points="100.0,206.0 103.6,215.0 96.4,215.0" fill="#1f2937"/>
<text x="108.0" y="260.0" font-size="11" fill="#374151" text-anchor="start">la redescubre el producer</text>
<rect x="24.0" y="363" width="22" height="14" rx="3" fill="#eef2ff" stroke="#4338ca" stroke-width="1.2"/>
<text x="54.0" y="374" font-size="11" fill="#374151">el único estado con TTL activo</text>
<line x1="253.0" y1="370" x2="269.0" y2="370" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4 3"/>
<polygon points="275.0,370 268.0,366.8 268.0,373.2" fill="#1f2937"/>
<text x="283.0" y="374" font-size="11" fill="#374151">sin reintento; vuelve a empezar</text>
<text x="24" y="400" font-size="11" fill="#6b7280">· una fila PROCESSING más vieja que JOB_TTL_MINUTES se borra en cada tick · una IN_PROGRESS vencida se recupera sólo con las tres colas vacías</text>
</svg>
