<svg viewBox="0 0 880 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="880" height="520" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="600" fill="#111827">Dónde se acota el consumo, y dónde no</text>
<text x="24" y="52" font-size="11" fill="#6b7280">Lo único con un tope real de memoria es Redis</text>
<rect x="24" y="72" width="832" height="110" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="40" y="94" font-size="10" font-weight="600" letter-spacing="0.08em" fill="#6b7280">TILES-PROCESSOR</text>
<rect x="24" y="206" width="832" height="110" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="40" y="228" font-size="10" font-weight="600" letter-spacing="0.08em" fill="#6b7280">DATA-SERVICE</text>
<rect x="24" y="340" width="832" height="110" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="40" y="362" font-size="10" font-weight="600" letter-spacing="0.08em" fill="#6b7280">ALERTS-SERVICE</text>
<rect x="40" y="108" width="240" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="160.0" y="130.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">5 workers × 2 unidades</text>
<text x="160.0" y="146.5" font-size="11" fill="#6b7280" text-anchor="middle">WORKER_CONCURRENCY · colas separadas</text>
<rect x="320" y="108" width="240" height="52" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
<text x="440.0" y="130.5" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">un subproceso por unidad</text>
<text x="440.0" y="146.5" font-size="11" fill="#6b7280" text-anchor="middle">tope de 30 min · sin límite de RAM</text>
<rect x="600" y="108" width="240" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="720.0" y="130.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">descubrimiento cada 5 min</text>
<text x="720.0" y="146.5" font-size="11" fill="#6b7280" text-anchor="middle">la avalancha se vuelve retraso</text>
<rect x="40" y="242" width="240" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="160.0" y="264.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Redis --maxmemory 5 GB</text>
<text x="160.0" y="280.5" font-size="11" fill="#6b7280" text-anchor="middle">el único tope real</text>
<circle cx="44" cy="246" r="13" fill="#ffffff" stroke="#d1d5db"/>
<g transform="translate(36.0 238.0) scale(0.6667)"><path fill="#FF4438" d="M22.71 13.145c-1.66 2.092-3.452 4.483-7.038 4.483-3.203 0-4.397-2.825-4.48-5.12.701 1.484 2.073 2.685 4.214 2.63 4.117-.133 6.94-3.852 6.94-7.239 0-4.05-3.022-6.972-8.268-6.972-3.752 0-8.4 1.428-11.455 3.685C2.59 6.937 3.885 9.958 4.35 9.626c2.648-1.904 4.748-3.13 6.784-3.744C8.12 9.244.886 17.05 0 18.425c.1 1.261 1.66 4.648 2.424 4.648.232 0 .431-.133.664-.365a100.49 100.49 0 0 0 5.54-6.765c.222 3.104 1.748 6.898 6.014 6.898 3.819 0 7.604-2.756 9.33-8.965.2-.764-.73-1.361-1.261-.73zm-4.349-5.013c0 1.959-1.926 2.922-3.685 2.922-.941 0-1.664-.247-2.235-.568 1.051-1.592 2.092-3.225 3.21-4.973 1.972.334 2.71 1.43 2.71 2.619z"/></g>
<rect x="320" y="242" width="240" height="52" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
<text x="440.0" y="264.5" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">API sin límite de peticiones</text>
<text x="440.0" y="280.5" font-size="11" fill="#6b7280" text-anchor="middle">consultas puntuales ocupan hilos</text>
<rect x="600" y="242" width="240" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="720.0" y="264.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">mapas base sin caché</text>
<text x="720.0" y="280.5" font-size="11" fill="#6b7280" text-anchor="middle">8 en paralelo · 4 s de plazo</text>
<rect x="40" y="376" width="240" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="160.0" y="398.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">cola 16 · 2 workers · 150 s</text>
<text x="160.0" y="414.5" font-size="11" fill="#6b7280" text-anchor="middle">rechaza con 503 al llenarse</text>
<rect x="320" y="376" width="240" height="52" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
<text x="440.0" y="398.5" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">intersección sin tope</text>
<text x="440.0" y="414.5" font-size="11" fill="#6b7280" text-anchor="middle">en el hilo de la API</text>
<rect x="600" y="376" width="240" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="720.0" y="398.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">GIF sin retención</text>
<text x="720.0" y="414.5" font-size="11" fill="#6b7280" text-anchor="middle">el volumen sólo crece</text>
<rect x="24.0" y="463" width="22" height="14" rx="3" fill="#eef2ff" stroke="#4338ca" stroke-width="1.2"/>
<text x="54.0" y="474" font-size="11" fill="#374151">donde falta el límite</text>
<text x="24" y="500" font-size="11" fill="#6b7280">· ningún contenedor declara mem_limit ni cpus · un worker que crece hace que el sistema operativo elija una víctima, y puede ser la base o la caché</text>
</svg>
