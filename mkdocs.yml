site_name: Docs Visualizador MapaSMN
site_description: Documentación del Sistema de Visualización Meteorológica
docs_dir: docs

# Built straight into the Angular app's static assets: `public/**/*` is an asset
# glob in angular.json, so both `ng build` and `ng serve` copy the site verbatim
# and nginx serves it at /docs-site/. Gitignored — rebuild with `make docs`.
site_dir: public/docs-site

# MkDocs emits relative URLs throughout, so the build is relocatable and the
# same output works at whatever path it is mounted on.
use_directory_urls: true

exclude_docs: |
  # Illustration for the repository README, not part of the site.
  imgs/general_data_flow.png
  # Research notes from the documentation subagents; never shipped.
  tmp-docs-agents/

# Explicit and exhaustive. Chapter numbers are literal text: there is no
# numbering plugin, so the number in each label below must match the page's
# frontmatter `title:` and its `# H1` exactly (scripts/docs-nav-check.py checks
# the three against each other). Numbers never enter a filename or URL.
# NOTE: --strict does NOT turn a page missing from nav into an error — MkDocs
# only logs it at INFO level and builds it unreachable. `make docs-check` is
# what catches that, together with broken raw-HTML <video> paths and anchors.
nav:
  - "1. Inicio": index.md
  - Manual de usuario:
      - manual/index.md
      - "2. Primeros pasos": manual/primeros-pasos.md
      - "3. Trabajar con capas": manual/capas.md
      - "4. Qué muestra cada producto":
          - manual/productos/index.md
          - "4.1 Satélite GOES-19": manual/productos/satelite.md
          - "4.2 Radar SINARAME": manual/productos/radar.md
          - "4.3 Modelos numéricos": manual/productos/modelos.md
          - "4.4 Estaciones de superficie": manual/productos/estaciones.md
      - "5. Ver la evolución y consultar un punto": manual/animacion.md
      - "6. Emitir un aviso a corto plazo": manual/avisos.md
      - "7. El panel de estado": manual/panel-de-estado.md
      - "8. Glosario": manual/glosario.md
  - Documentación técnica:
      - tecnica/index.md
      - "9. Decisiones de arquitectura": tecnica/decisiones.md
      - "10. Cómo fluyen los datos": tecnica/flujo-de-datos.md
      - "11. Los servicios":
          - tecnica/servicios/index.md
          - "11.1 Tiles Processor": tecnica/servicios/tiles-processor.md
          - "11.2 Data Service": tecnica/servicios/data-service.md
          - "11.3 Alerts Service": tecnica/servicios/alerts-service.md
          - "11.4 Visualizer": tecnica/servicios/visualizer.md
      - "12. Contratos entre servicios":
          - tecnica/contratos/index.md
          - "12.1 API HTTP": tecnica/contratos/api.md
          - "12.2 Configuración y variables": tecnica/contratos/configuracion.md
          - "12.3 Almacenamiento y colas": tecnica/contratos/almacenamiento.md
      - "13. Topología de red": tecnica/operacion/topologia.md
      - "14. Puesta en marcha": tecnica/operacion/puesta-en-marcha.md
      - "15. Distribuir el sistema en varias máquinas": tecnica/operacion/distribucion.md
      - "16. Capacidad y dimensionamiento": tecnica/operacion/capacidad.md
      - "17. Despliegue y entrega continua": tecnica/operacion/despliegue.md
      - "18. Observabilidad y verificación": tecnica/operacion/observabilidad.md
      - "19. Seguridad":
          - tecnica/seguridad/index.md
          - "19.1 Superficie expuesta": tecnica/seguridad/superficie.md
          - "19.2 Datos y secretos": tecnica/seguridad/datos-y-secretos.md
          - "19.3 Endurecimiento": tecnica/seguridad/endurecimiento.md

theme:
  name: material
  language: es
  favicon: assets/favicon.ico
  logo: assets/smn-logo.png
  palette:
    # `custom` leaves the palette variables undefined so embed.css can set the
    # SMN colours from the app's own theme; a named colour would define them at
    # equal specificity and turn this into a load-order coin flip.
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.top
    - navigation.expand # Every nav section open on load, not just the current one
    - navigation.indexes # A section's own index.md becomes the clickable section entry
    - navigation.footer # Anterior/Siguiente links at the foot of every page
    - navigation.instant # Page swaps without a reload; the shell follows via document$
    - navigation.instant.prefetch # Start fetching on hover; prefetch.js covers the rest
    - content.code.copy
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  # The glossary is written as definition lists; without this they render as
  # paragraphs with stray colons.
  - def_list
  # Material icons in the landing page cards (`:material-…:`). Without the
  # extension the shortcodes render literally.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      # Unicode-preserving slugs. The default slugify strips accents, which
      # would turn #introducción into #introduccin and break every
      # hand-written table of contents in the Spanish pages.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.superfences
  - pymdownx.highlight

hooks:
  # Stamps ?v=<content hash> on imgs/ and videos/ references, which is what lets
  # nginx serve them immutable without a replaced file going stale.
  - hooks/media_cache_busting.py

plugins:
  - search:
      lang: es

extra_css:
  - stylesheets/embed.css

extra_javascript:
  - javascripts/lazy-video.js
  - javascripts/prefetch.js
  - javascripts/nav-progress.js
  # Click-to-zoom for the architecture diagrams, which are wider than the
  # iframe the site is embedded in.
  - javascripts/diagram-zoom.js

extra:
  generator: false
