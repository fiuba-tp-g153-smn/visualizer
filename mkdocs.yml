site_name: Docs Visualizador MapaSMN
site_description: Documentación del Sistema de Visualización Meteorológica
docs_dir: docs

# Built straight into the Angular app's static assets: `public/**/*` is an asset
# glob in angular.json, so both `ng build` and `ng serve` copy the site verbatim
# and nginx serves it at /docs-site/. Gitignored — rebuild with `make docs`.
site_dir: public/docs-site

# MkDocs emits relative URLs throughout, so the build is relocatable and the
# same output works at whatever path it is mounted on.
use_directory_urls: true

exclude_docs: |
  # Illustration for the repository README, not part of the site.
  imgs/general_data_flow.png
  # Research notes from the documentation subagents; never shipped.
  tmp-docs-agents/

# Explicit and exhaustive: a page missing from nav is built but unreachable,
# and --strict is what turns that from a silent omission into a build error.
nav:
  - Inicio: index.md
  - Manual de usuario:
      - manual/index.md
      - Primeros pasos: manual/primeros-pasos.md
      - Trabajar con capas: manual/capas.md
      - El mapa de fondo: manual/mapa-base.md
      - Qué muestra cada producto:
          - Satélite: manual/productos/satelite.md
          - Radar: manual/productos/radar.md
          - Modelos de pronóstico: manual/productos/modelos.md
          - Estaciones: manual/productos/estaciones.md
          - Capas de referencia: manual/productos/referencia.md
      - Ver la evolución en el tiempo: manual/animacion.md
      - Consultar un valor puntual: manual/consulta-puntual.md
      - Emitir un aviso a corto plazo: manual/avisos.md
      - El panel de estado: manual/panel-de-estado.md
      - Glosario: manual/glosario.md
  - Documentación técnica:
      - tecnica/index.md
      - Decisiones de arquitectura: tecnica/decisiones.md
      - Flujo de datos: tecnica/flujo-de-datos.md
      - Servicios:
          - Tiles Processor: tecnica/servicios/tiles-processor.md
          - Data Service: tecnica/servicios/data-service.md
          - Alerts Service: tecnica/servicios/alerts-service.md
          - Visualizer: tecnica/servicios/visualizer.md
      - Contratos:
          - API HTTP: tecnica/contratos/api.md
          - Configuración y variables: tecnica/contratos/configuracion.md
          - Almacenamiento y colas: tecnica/contratos/almacenamiento.md
      - Operación:
          - Topología de red: tecnica/operacion/topologia.md
          - Puesta en marcha: tecnica/operacion/puesta-en-marcha.md
          - Despliegue e infraestructura: tecnica/operacion/despliegue.md
          - Entrega continua: tecnica/operacion/entrega-continua.md
          - Verificación automática: tecnica/operacion/calidad.md
          - Observabilidad: tecnica/operacion/observabilidad.md
          - Capacidad y dimensionamiento: tecnica/operacion/capacidad.md
      - Seguridad:
          - tecnica/seguridad/index.md
          - Superficie expuesta: tecnica/seguridad/superficie.md
          - Datos y secretos: tecnica/seguridad/datos-y-secretos.md
          - Endurecimiento: tecnica/seguridad/endurecimiento.md

theme:
  name: material
  language: es
  favicon: assets/favicon.ico
  logo: assets/smn-logo.png
  palette:
    # `custom` leaves the palette variables undefined so embed.css can set the
    # SMN colours from the app's own theme; a named colour would define them at
    # equal specificity and turn this into a load-order coin flip.
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.top
    - navigation.expand # Every nav section open on load, not just the current one
    - navigation.indexes # A section's own index.md becomes the clickable section entry
    - navigation.footer # Anterior/Siguiente links at the foot of every page
    - navigation.instant # Page swaps without a reload; the shell follows via document$
    - navigation.instant.prefetch # Start fetching on hover; prefetch.js covers the rest
    - content.code.copy
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  # The glossary is written as definition lists; without this they render as
  # paragraphs with stray colons.
  - def_list
  # Material icons in the landing page cards (`:material-…:`). Without the
  # extension the shortcodes render literally.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      # Unicode-preserving slugs. The default slugify strips accents, which
      # would turn #introducción into #introduccin and break every
      # hand-written table of contents in the Spanish pages.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.superfences
  - pymdownx.highlight

hooks:
  # Stamps ?v=<content hash> on imgs/ and videos/ references, which is what lets
  # nginx serve them immutable without a replaced file going stale.
  - hooks/media_cache_busting.py

plugins:
  - search:
      lang: es

extra_css:
  - stylesheets/embed.css

extra_javascript:
  - javascripts/lazy-video.js
  - javascripts/prefetch.js
  - javascripts/nav-progress.js
  # Click-to-zoom for the architecture diagrams, which are wider than the
  # iframe the site is embedded in.
  - javascripts/diagram-zoom.js

extra:
  generator: false
