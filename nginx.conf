server {
    # Listen on port 80 (standard HTTP port)
    listen 80;
    server_name localhost;

    # Where the built Angular application is located
    root /usr/share/nginx/html;
    index index.html;

    # Emit relative Location headers. The docs use directory URLs, so
    # /docs-site/uso-general is served by redirecting to .../uso-general/;
    # an absolute redirect would rebuild that URL from this server block and
    # drop the port behind Coolify's proxy or a port-mapped container.
    absolute_redirect off;

    # ── Compression ──
    # gzip_proxied any is required: Coolify's reverse proxy fronts this nginx and
    # forwards a Via header, which would otherwise disable gzip for every request.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json
        font/ttf
        font/otf;

    # ── Documentation ────────────────────────────────────────────────────────
    # The MkDocs Material site, built into public/docs-site and embedded by the
    # /docs route. These are prefix locations on purpose: `^~` stops nginx from
    # evaluating the regex locations below, so the longest prefix here decides,
    # and a regex block for the docs would never be reached.

    # Material's own bundle and stylesheets are content-hashed, so a new version
    # arrives under a new name. Only these two subtrees are hashed.
    location ^~ /docs-site/assets/javascripts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /docs-site/assets/stylesheets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The rest of assets/ is ours and unhashed — favicon, the SMN logo.
    location ^~ /docs-site/assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Screenshots and demo clips. Every reference to them carries ?v=<content
    # hash> (hooks/media_cache_busting.py), so replacing a file in place changes
    # the URL and the new bytes are fetched immediately — which is what makes it
    # safe to pin the old URL forever instead of revalidating a dozen images on
    # every page view.
    location ^~ /docs-site/imgs/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /docs-site/videos/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pages, the search index, and the extra_css/extra_javascript we add — none
    # of them hashed. `no-cache` here made every page swap cost a round trip and
    # made prefetching pointless, since a prefetched response still has to be
    # revalidated before it can be used. A short max-age makes navigation
    # zero-network, and stale-while-revalidate keeps it that way afterwards by
    # painting the cached copy while the refresh happens behind it. A deploy is
    # picked up within the minute; browsers without SWR just fall back to
    # max-age and are no worse than before.
    # A miss stays inside the docs (=404) rather than falling through to the
    # SPA shell, so a bad docs link looks like a bad docs link.
    location ^~ /docs-site/ {
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=604800";
        try_files $uri $uri/ =404;
    }

    # ── Caching ──────────────────────────────────────────────────────────────
    # Build outputs are content-hashed (outputHashing: all), so a new deploy
    # produces new filenames — these can be cached forever.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Unhashed assets copied verbatim from public/ — moderate TTL (1 week).
    location = /icono.png  { add_header Cache-Control "public, max-age=604800"; }
    location = /favicon.ico { add_header Cache-Control "public, max-age=604800"; }

    # Handle all incoming requests
    location / {
        # The SPA shell must always revalidate so new deploys are picked up
        # immediately (index.html itself is not content-hashed).
        add_header Cache-Control "no-cache";
        # Try to serve requested file ($uri) or directory ($uri/).
        # If not found, fall back to index.html (crucial for Angular/SPA routing)
        try_files $uri $uri/ /index.html;
    }

    # Error pages configuration
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
