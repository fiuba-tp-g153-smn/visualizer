services:
  # One-shot: renders docs/ into public/docs-site and exits. Not a running
  # service — ng serve picks the output up through the bind mount, and the
  # `public/**/*` asset glob serves it at /docs-site/. Use `make docs-serve`
  # for a live-reloading docs preview while writing.
  docs-build:
    image: squidfunk/mkdocs-material:9.7.7
    # Keeps the output owned by the caller; make up exports these.
    user: "${DOCS_UID:-1000}:${DOCS_GID:-1000}"
    environment:
      - NO_MKDOCS_2_WARNING=1
    volumes:
      - .:/docs
    command: build --strict

  visualizer:
    container_name: visualizer-dev-container
    depends_on:
      docs-build:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "4201:4200"
    environment:
      - DATA_SERVICE_BASE_URL=${DATA_SERVICE_BASE_URL}
      - ALERTS_SERVICE_BASE_URL=${ALERTS_SERVICE_BASE_URL}
      - SMN_API_PROMPT_FOR_TOKEN=${SMN_API_PROMPT_FOR_TOKEN}
      - APP_HOST_PORT=${APP_HOST_PORT}
      - DOCS_URL=${DOCS_URL}
      - IGN_PLACE_SEARCH_URL=${IGN_PLACE_SEARCH_URL}
      - NOMINATIM_SEARCH_URL=${NOMINATIM_SEARCH_URL}
    volumes:
      - .:/app
      - visualizer_node_modules:/app/node_modules
    command:
      - sh
      - -c
      - |
        if cmp -s package-lock.json node_modules/.deps-installed 2>/dev/null; then
          echo "✅ visualizer deps already current — skipping install"
        else
          echo "📦 visualizer deps changed — running npm ci..."
          npm ci && cp package-lock.json node_modules/.deps-installed
        fi
        # --poll: the repo lives on a fuseblk (NTFS) mount, where inotify does
        # not report new files. Without it webpack caches the failed resolution
        # and every freshly added file is "Module not found" until a restart.
        exec npm start -- --host 0.0.0.0 --poll 2000
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:4200 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
      start_interval: 1s

volumes:
  visualizer_node_modules:
